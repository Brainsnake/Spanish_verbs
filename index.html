<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spaans Smart Layout</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #e6fffa;
            font-family: -apple-system, sans-serif;
            text-align: center;
            overflow: hidden; /* Voorkomt handmatig scrollen door de gebruiker */
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* Dynamische spacer: 200px standaard, 20px als toetsenbord open is */
        #dynamic-spacer {
            height: 180px;
            transition: height 0.3s ease; /* Zorgt voor een vloeiende overgang */
            width: 100%;
        }

        h1 { font-size: 1.8rem; color: #2d3748; margin: 10px 0 0 0; text-transform: uppercase; }
        p { font-size: 1.2rem; color: #4a5568; margin: 5px 0 10px 0; }
        #feedback { font-size: 1.3rem; font-weight: bold; min-height: 2.2rem; margin-bottom: 10px; }

        input {
            font-size: 1.5rem;
            padding: 12px;
            width: 80%;
            border: 2px solid #48bb78;
            border-radius: 12px;
            outline: none;
            background: white;
        }

        button {
            font-size: 1.3rem;
            padding: 12px 30px;
            margin-top: 15px;
            background-color: #48bb78;
            color: white;
            border: none;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="dynamic-spacer"></div>

    <h1 id="verb">Laden...</h1>
    <p id="info"></p>
    
    <div id="feedback"></div>

    <input type="text" id="answer" placeholder="Typ..." autocomplete="off" autocapitalize="none" spellcheck="false">
    <br>
    <button id="mainButton" onclick="checkAnswer()">Controleer</button>
</div>

<script>
    const spacer = document.getElementById('dynamic-spacer');
    const inputField = document.getElementById('answer');

    // --- TOETSENBORD LOGICA ---
    // Wanneer het invoerveld focus krijgt (toetsenbord opent)
    inputField.addEventListener('focus', () => {
        spacer.style.height = "150px"; // Maak spacer klein zodat tekst naar beneden zakt
    });

    // Wanneer het invoerveld focus verliest (toetsenbord sluit)
    inputField.addEventListener('blur', () => {
        spacer.style.height = "180px"; // Herstel spacer
    });

    // --- PROGRAMMA LOGICA ---
    const jsonUrl = "https://gist.githubusercontent.com/Brainsnake/f9b6841f2705d38bb1164ce6c054cb81/raw/9b246b0cd6b250b5eedcc6ec006876fc490c56dd/werkwoorden.json"; 
    let verbData = {};
    const pronouns = ["yo", "tú", "él/ella/usted", "nosotros/as", "vosotros/as", "ellos/ellas/ustedes"];
    let currentCorrect = "";
    let showingError = false;

    async function fetchData() {
        try {
            const response = await fetch(jsonUrl);
            verbData = await response.json();
            nextQuestion();
        } catch (error) {
            document.getElementById('verb').innerText = "Fout!";
        }
    }

    function nextQuestion() {
        showingError = false;
        const verbs = Object.keys(verbData);
        const verb = verbs[Math.floor(Math.random() * verbs.length)];
        const tenses = Object.keys(verbData[verb]);
        const tense = tenses[Math.floor(Math.random() * tenses.length)];
        const personIdx = Math.floor(Math.random() * 6);

        currentCorrect = verbData[verb][tense][personIdx];
        document.getElementById('verb').innerText = verb;
        document.getElementById('info').innerText = `${tense} (${pronouns[personIdx]})`;
        
        inputField.value = "";
        inputField.style.backgroundColor = "white";
        document.getElementById('feedback').innerText = "";
        document.getElementById('mainButton').innerText = "Controleer";
        inputField.focus();
    }

    function checkAnswer() {
        const userAns = inputField.value.trim().toLowerCase();
        const feedback = document.getElementById('feedback');
        const btn = document.getElementById('mainButton');

        if (showingError) {
            nextQuestion();
            return;
        }

        if (userAns === currentCorrect.toLowerCase()) {
            feedback.innerHTML = "<span style='color:green'>✅ ¡Bien!</span>";
            inputField.style.backgroundColor = "#c6f6d5";
            setTimeout(nextQuestion, 1200);
        } else {
            feedback.innerHTML = `<span style="color:red">❌ ${currentCorrect}</span>`;
            inputField.style.backgroundColor = "#fed7d7";
            btn.innerText = "Volgende";
            showingError = true;
        }
    }

    inputField.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkAnswer();
    });

    fetchData();
</script>

</body>
</html>
