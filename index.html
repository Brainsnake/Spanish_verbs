<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spaans met Score</title>
    <style>
        /* Voorkom scrollen en zet de basis vast */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e6fffa;
            font-family: -apple-system, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            padding-top: 40px; /* Ruimte onder Dynamic Island */
            box-sizing: border-box;
            position: relative;
        }

        /* Help-knop rechtsboven */
        .help-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.4rem;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            margin: 0;
            z-index: 10;
        }

        h1 { 
            font-size: 1.8rem; 
            color: #2d3748; 
            margin: 0; 
            text-transform: uppercase;
        }

        p { 
            font-size: 1.2rem; 
            color: #4a5568; 
            margin: 5px 0 15px 0;
        }

        #feedback { 
            font-size: 1.3rem; 
            font-weight: bold; 
            min-height: 2.5rem; 
            margin-bottom: 10px;
            width: 90%;
            text-align: center; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input {
            font-size: 1.5rem;
            padding: 12px;
            width: 80%;
            border: 2px solid #48bb78;
            border-radius: 12px;
            outline: none;
            background: white;
            text-align: center; 
            -webkit-appearance: none;
        }

        button {
            font-size: 1.3rem;
            padding: 12px 30px;
            margin-top: 20px;
            background-color: #48bb78;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #score-container {
            margin-top: 25px;
            font-size: 1rem;
            color: #718096;
            font-weight: bold;
        }

        /* --- STYLING VOOR HET OVERLAY SPIEKBRIEFJE --- */
        .overlay {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4); 
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Duwt het naar de onderkant */
            align-items: center;
        }

        .overlay-content {
            background-color: white;
            width: 94%;
            max-width: 380px;
            height: auto; 
            max-height: 43%; /* Halveert de hoogte zodat de vraag erboven past */
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15); 
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #718096;
            cursor: pointer;
        }

        .overlay h2 {
            font-size: 1.1rem;
            margin: 0 0 10px 0;
            color: #2d3748;
        }

        .tab-select {
            width: 100%;
            font-size: 1rem;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #48bb78; 
            margin-bottom: 10px;
            outline: none;
            background-color: #f7fafc;
        }

        .cheat-data {
            flex: 1;
            overflow-y: auto; 
            font-size: 0.85rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }

        th, td {
            border: 1px solid #e2e8f0;
            padding: 6px;
            text-align: left;
        }

        th {
            background-color: #edf2f7;
            color: #2d3748;
        }

        .perfecto-info {
            background-color: #f7fafc;
            padding: 8px;
            border-radius: 8px;
            border-left: 4px solid #48bb78;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <button class="help-btn" onclick="openCheatSheet()">💡</button>

    <h1 id="verb">Laden...</h1>
    <p id="info"></p>
    
    <div id="feedback"></div>

    <input type="text" id="answer" placeholder="Typ..." autocomplete="off" autocapitalize="none" spellcheck="false">
    <br>
    <button id="mainButton" onclick="checkAnswer()">Controleer</button>

    <div id="score-container">
        Score: <span id="correct-count">0</span>/<span id="total-count">0</span> (<span id="percentage">0</span>%)
    </div>
</div>

<div id="cheatSheet" class="overlay" onclick="closeCheatSheet(event)" style="display: none;">
    <div class="overlay-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeCheatSheet(event)">×</span>
        <h2>Spiekbriefje Uitgangen</h2>
        
        <select id="tenseSelect" class="tab-select" onchange="changeCheatTense()">
            <option value="Presente">Presente</option>
            <option value="Pretérito Indefinido">Pretérito Indefinido</option>
            <option value="Pretérito Imperfecto">Pretérito Imperfecto</option>
            <option value="Pretérito Perfecto">Pretérito Perfecto</option>
            <option value="Futuro">Futuro</option>
        </select>

        <div class="cheat-data" id="cheatDataBox"></div>
    </div>
</div>

<script>
    const inputField = document.getElementById('answer');
    let correctAttempts = 0, totalAttempts = 0;
    let currentTense = ""; 

    const lockScroll = () => { window.scrollTo(0, 0); };

    // ALLE WERKWOORDEN DIRECT LOKAAL INGEBOUWD (Geen downloads meer nodig!)
    let verbData = {
      "irregulars": {
        "Abrir": {
          "Presente": ["abro", "abres", "abre", "abrimos", "abrís", "abren"],
          "Pretérito Indefinido": ["abrí", "abriste", "abrió", "abrimos", "abristeis", "abrieron"],
          "Pretérito Perfecto": ["he abierto", "has abierto", "ha abierto", "hemos abierto", "habéis abierto", "han abierto"],
          "Pretérito Imperfecto": ["abría", "abrías", "abría", "abríamos", "abríais", "abrían"],
          "Futuro": ["abriré", "abrirás", "abrirá", "abriremos", "abriréis", "abrirán"]
        },
        "Acertar": {
          "Presente": ["acierto", "aciertas", "acienta", "acertamos", "acertáis", "aciertan"],
          "Pretérito Indefinido": ["acerté", "acertaste", "acertó", "acertamos", "acertasteis", "acertaron"],
          "Pretérito Perfecto": ["he acertado", "has acertado", "ha acertado", "hemos acertado", "habéis acertado", "han acertado"],
          "Pretérito Imperfecto": ["acertaba", "acertabas", "acertaba", "acertábamos", "acertabais", "acertaban"],
          "Futuro": ["acertaré", "acertarás", "acertará", "acertaremos", "acertaréis", "acertarán"]
        },
        "Andar": {
          "Presente": ["ando", "andas", "anda", "andamos", "andáis", "andan"],
          "Pretérito Indefinido": ["anduve", "anduviste", "anduvo", "anduvimos", "anduvisteis", "anduvieron"],
          "Pretérito Perfecto": ["he andado", "has andado", "ha andado", "hemos andado", "habéis andado", "han andado"],
          "Pretérito Imperfecto": ["andaba", "andabas", "andaba", "andábamos", "andabais", "andaban"],
          "Futuro": ["andaré", "andarás", "andará", "andaremos", "andaréis", "andarán"]
        },
        "Atravesar": {
          "Presente": ["atravieso", "atraviesas", "atraviesa", "atravesamos", "atravesáis", "atraviesan"],
          "Pretérito Indefinido": ["atravesé", "atravesaste", "atravesó", "atravesamos", "atravesasteis", "atravesaron"],
          "Pretérito Perfecto": ["he atravesado", "has atravesado", "ha atravesado", "hemos atravesado", "habéis atravesado", "han atravesado"],
          "Pretérito Imperfecto": ["atravesaba", "atravesabas", "atravesaba", "atravesábamos", "atravesabais", "atravesaban"],
          "Futuro": ["atravesaré", "atravesarás", "atravesará", "atravesaremos", "atravesaréis", "atravesarán"]
        },
        "Caber": {
          "Presente": ["quepo", "cabes", "cabe", "cabemos", "cabéis", "caben"],
          "Pretérito Indefinido": ["cupe", "cupiste", "cupo", "cupimos", "cupisteis", "cupieron"],
          "Pretérito Perfecto": ["he cabido", "has cabido", "ha cabido", "hemos cabido", "habéis cabido", "han cabido"],
          "Pretérito Imperfecto": ["cabía", "cabías", "cabía", "cabíamos", "cabíais", "cabían"],
          "Futuro": ["cabré", "cabrás", "cabrá", "cabremos", "cabréis", "cabrán"]
        },
        "Calentar": {
          "Presente": ["caliento", "calientas", "calienta", "calentamos", "calentáis", "calientan"],
          "Pretérito Indefinido": ["calenté", "calentaste", "calentó", "calentamos", "calentasteis", "calentaron"],
          "Pretérito Perfecto": ["he calentado", "has calentado", "ha calentado", "hemos calentado", "habéis calentado", "han calentado"],
          "Pretérito Imperfecto": ["calentaba", "calentabas", "calentaba", "calentábamos", "calentabais", "calentaban"],
          "Futuro": ["calentaré", "calentarás", "calentará", "calentaremos", "calentaréis", "calentarán"]
        },
        "Comenzar": {
          "Presente": ["comienzo", "comienzas", "comienza", "comenzamos", "comenzáis", "comienzan"],
          "Pretérito Indefinido": ["comencé", "comenzaste", "comenzó", "comenzamos", "comenzasteis", "comenzaron"],
          "Pretérito Perfecto": ["he comenzado", "has comenzado", "ha comenzado", "hemos comenzado", "habéis comenzado", "han comenzado"],
          "Pretérito Imperfecto": ["comenzaba", "comenzabas", "comenzaba", "comenzábamos", "comenzabais", "comenzaban"],
          "Futuro": ["comenzaré", "comenzarás", "comenzará", "comenzaremos", "comenzaréis", "comenzarán"]
        },
        "Cubrir": {
          "Presente": ["cubro", "cubres", "cubre", "cubrimos", "cubrís", "cubren"],
          "Pretérito Indefinido": ["cubrí", "cubriste", "cubrió", "cubrimos", "cubristeis", "cubrieron"],
          "Pretérito Perfecto": ["he cubierto", "has cubierto", "ha cubierto", "hemos cubierto", "habéis cubierto", "han cubierto"],
          "Pretérito Imperfecto": ["cubría", "cubrías", "cubría", "cubríamos", "cubriais", "cubrían"],
          "Futuro": ["cubriré", "cubrirás", "cubrirá", "cubriremos", "cubriréis", "cubrirán"]
        },
        "Dar": {
          "Presente": ["doy", "das", "da", "damos", "dais", "dan"],
          "Pretérito Indefinido": ["di", "diste", "dio", "dimos", "disteis", "dieron"],
          "Pretérito Perfecto": ["he dado", "has dado", "ha dado", "hemos dado", "habéis dado", "han dado"],
          "Pretérito Imperfecto": ["daba", "dabas", "daba", "dábamos", "dabais", "daban"],
          "Futuro": ["daré", "darás", "dará", "daremos", "daréis", "darán"]
        },
        "Decir": {
          "Presente": ["digo", "dices", "dice", "decimos", "decís", "dicen"],
          "Pretérito Indefinido": ["dije", "dijiste", "dijo", "dijimos", "dijisteis", "dijeron"],
          "Pretérito Perfecto": ["he dicho", "has dicho", "ha dicho", "hemos dicho", "habéis dicho", "han dicho"],
          "Pretérito Imperfecto": ["decía", "decías", "decía", "decíamos", "decíais", "decían"],
          "Futuro": ["diré", "dirás", "dirá", "diremos", "diréis", "dirán"]
        },
        "Descubrir": {
          "Presente": ["descubro", "descubres", "descubre", "descubrimos", "descubrís", "descubren"],
          "Pretérito Indefinido": ["descubrí", "descubriste", "descubrió", "descubrimos", "descubristeis", "descubrieron"],
          "Pretérito Perfecto": ["he descubierto", "has descubierto", "ha descubierto", "hemos descubierto", "habéis descubierto", "han descubierto"],
          "Pretérito Imperfecto": ["descubría", "descubrías", "descubría", "descubríamos", "descubríais", "descubrían"],
          "Futuro": ["descubriré", "descubrirás", "descubrirá", "descubriremos", "descubriréis", "descubrirán"]
        },
        "Ser": {
          "Presente": ["soy", "eres", "es", "somos", "sois", "son"],
          "Pretérito Indefinido": ["fui", "fuiste", "fue", "fuimos", "fuisteis", "fueron"],
          "Pretérito Perfecto": ["he sido", "has sido", "ha sido", "hemos sido", "habéis sido", "han sido"],
          "Pretérito Imperfecto": ["era", "eras", "era", "éramos", "erais", "eran"],
          "Futuro": ["seré", "serás", "será", "seremos", "seréis", "serán"]
        },
        "Tener": {
          "Presente": ["tengo", "tienes", "tiene", "tenemos", "tenéis", "tienen"],
          "Pretérito Indefinido": ["tuve", "tuviste", "tuvo", "tuvimos", "tuvisteis", "tuvieron"],
          "Pretérito Perfecto": ["he tenido", "has tenido", "ha tenido", "hemos tenido", "habéis tenido", "han tenido"],
          "Pretérito Imperfecto": ["tenía", "tenías", "tenía", "teníamos", "teníais", "tenían"],
          "Futuro": ["tendré", "tendrás", "tendrá", "tendremos", "tendréis", "tendrán"]
        }
      },
      "regulars": [
        "Abrir", "Aprender", "Bailar", "Beber", "Buscar", "Cantar", "Comer", 
        "Comprar", "Correr", "Escribir", "Escuchar", "Estudiar", "Hablar", 
        "Llegar", "Pagar", "Trabajar", "Vender", "Viajar", "Vivir"
      ]
    };

    const pronouns = ["yo", "tú", "él/ella/usted", "nosotros/as", "vosotros/as", "ellos/ellas/ustedes"];
    let currentCorrect = "";
    let showingError = false;

    inputField.addEventListener('focus', () => setTimeout(lockScroll, 50));
    inputField.addEventListener('blur', () => setTimeout(lockScroll, 50));
    window.visualViewport.addEventListener('resize', lockScroll);
    window.visualViewport.addEventListener('scroll', () => { if (window.scrollY !== 0) lockScroll(); });

    const endings = {
        "ar": {
            "Presente": ["o", "as", "a", "amos", "áis", "an"],
            "Pretérito Indefinido": ["é", "aste", "ó", "amos", "asteis", "aron"],
            "Pretérito Imperfecto": ["aba", "abas", "aba", "ábamos", "abais", "aban"],
            "Futuro": ["aré", "arás", "ará", "aremos", "aréis", "arán"]
        },
        "er": {
            "Presente": ["o", "es", "e", "emos", "éis", "en"],
            "Pretérito Indefinido": ["í", "iste", "ió", "imos", "isteis", "ieron"],
            "Pretérito Imperfecto": ["ía", "ías", "ía", "íamos", "íais", "ían"],
            "Futuro": ["eré", "erás", "erá", "eremos", "eréis", "erán"]
        },
        "ir": {
            "Presente": ["o", "es", "e", "imos", "ís", "en"],
            "Pretérito Indefinido": ["í", "iste", "ió", "imos", "isteis", "ieron"],
            "Pretérito Imperfecto": ["ía", "ías", "ía", "íamos", "íais", "ían"],
            "Futuro": ["iré", "irás", "irá", "iremos", "iréis", "irán"]
        }
    };

    const cheatSheetsData = {
        "Presente": `<table><tr><th>Persoon</th><th>-ar</th><th>-er</th><th>-ir</th></tr><tr><td>yo</td><td><b>-o</b></td><td><b>-o</b></td><td><b>-o</b></td></tr><tr><td>tú</td><td><b>-as</b></td><td><b>-es</b></td><td><b>-es</b></td></tr><tr><td>él/ella</td><td><b>-a</b></td><td><b>-e</b></td><td><b>-e</b></td></tr><tr><td>nosotros</td><td><b>-amos</b></td><td><b>-emos</b></td><td><b>-imos</b></td></tr><tr><td>vosotros</td><td><b>-áis</b></td><td><b>-éis</b></td><td><b>-ís</b></td></tr><tr><td>ellos/as</td><td><b>-an</b></td><td><b>-en</b></td><td><b>-en</b></td></tr></table>`,
        "Pretérito Indefinido": `<table><tr><th>Persoon</th><th>-ar</th><th>-er / -ir</th></tr><tr><td>yo</td><td><b>-é</b></td><td><b>-í</b></td></tr><tr><td>tú</td><td><b>-aste</b></td><td><b>-iste</b></td></tr><tr><td>él/ella</td><td><b>-ó</b></td><td><b>-ió</b></td></tr><tr><td>nosotros</td><td><b>-amos</b></td><td><b>-imos</b></td></tr><tr><td>vosotros</td><td><b>-asteis</b></td><td><b>-isteis</b></td></tr><tr><td>ellos/as</td><td><b>-aron</b></td><td><b>-ieron</b></td></tr></table>`,
        "Pretérito Imperfecto": `<table><tr><th>Persoon</th><th>-ar</th><th>-er / -ir</th></tr><tr><td>yo</td><td><b>-aba</b></td><td><b>-ía</b></td></tr><tr><td>tú</td><td><b>-abas</b></td><td><b>-ías</b></td></tr><tr><td>él/ella</td><td><b>-aba</b></td><td><b>-ía</b></td></tr><tr><td>nosotros</td><td><b>-ábamos</b></td><td><b>-íamos</b></td></tr><tr><td>vosotros</td><td><b>-abais</b></td><td><b>-íais</b></td></tr><tr><td>ellos/as</td><td><b>-aban</b></td><td><b>-ían</b></td></tr></table>`,
        "Pretérito Perfecto": `<div class="perfecto-info"><b>Hulpwerkwoord (Haber):</b><br>yo <b>he</b>, tú <b>has</b>, él <b>ha</b>, nos. <b>hemos</b>, vos. <b>habéis</b>, ellos <b>han</b><br><br><b>+ Voltooid Deelwoord:</b><br>-ar wordt <b>-ado</b><br>-er / -ir wordt <b>-ido</b></div>`,
        "Futuro": `<div class="perfecto-info">Plak de uitgang achter het <b>HELE werkwoord</b>:<br><br>yo <b>-é</b>, tú <b>-as</b>, él <b>-á</b>, nos. <b>-emos</b>, vos. <b>-éis</b>, ellos <b>-án</b></div>`
    };

    function openCheatSheet() {
        if (!currentTense) return; 
        document.getElementById('tenseSelect').value = currentTense;
        document.getElementById('cheatSheet').style.display = 'flex';
        changeCheatTense();
    }

    function closeCheatSheet(e) {
        document.getElementById('cheatSheet').style.display = 'none';
    }

    function changeCheatTense() {
        const selectedTense = document.getElementById('tenseSelect').value;
        document.getElementById('cheatDataBox').innerHTML = cheatSheetsData[selectedTense];
    }

    function conjugateRegular(verb, tense, personIdx) {
        const type = verb.slice(-2).toLowerCase();
        const stem = verb.slice(0, -2);
        
        if (tense === "Pretérito Perfecto") {
            const participle = type === "ar" ? "ado" : "ido";
            const aux = ["he", "has", "ha", "hemos", "habéis", "han"];
            return `${aux[personIdx]} ${stem}${participle}`;
        }
        
        return stem + endings[type][tense][personIdx];
    }

    function updateScoreDisplay() {
        document.getElementById('correct-count').innerText = correctAttempts;
        document.getElementById('total-count').innerText = totalAttempts;
        const perc = totalAttempts === 0 ? 0 : Math.round((correctAttempts / totalAttempts) * 100);
        document.getElementById('percentage').innerText = perc;
    }

    function nextQuestion() {
        showingError = false;
        const hasRegulars = verbData.regulars && verbData.regulars.length > 0;
        const useRegular = Math.random() > 0.5 && hasRegulars;
        
        let verb, tense, personIdx = Math.floor(Math.random() * 6);
        const tenses = ["Presente", "Pretérito Indefinido", "Pretérito Perfecto", "Pretérito Imperfecto", "Futuro"];
        tense = tenses[Math.floor(Math.random() * tenses.length)];

        currentTense = tense;

        if (useRegular) {
            verb = verbData.regulars[Math.floor(Math.random() * verbData.regulars.length)];
            currentCorrect = conjugateRegular(verb, tense, personIdx);
        } else {
            const irregulars = Object.keys(verbData.irregulars);
            verb = irregulars[Math.floor(Math.random() * irregulars.length)];
            currentCorrect = verbData.irregulars[verb][tense][personIdx];
        }
        
        document.getElementById('verb').innerText = verb;
        document.getElementById('info').innerText = `${tense} (${pronouns[personIdx]})`;
        
        inputField.value = "";
        inputField.style.backgroundColor = "white";
        document.getElementById('feedback').innerText = "";
        document.getElementById('mainButton').innerText = "Controleer";
        
        lockScroll();
        setTimeout(() => { inputField.focus(); }, 100);
    }

    function checkAnswer() {
        const userAns = inputField.value.trim().toLowerCase();
        const feedback = document.getElementById('feedback');
        const btn = document.getElementById('mainButton');

        if (showingError) {
            nextQuestion();
            return;
        }

        totalAttempts++;

        if (userAns === currentCorrect.toLowerCase()) {
            correctAttempts++;
            feedback.innerHTML = "<span style='color:green'>✅ ¡Muy bien!</span>";
            inputField.style.backgroundColor = "#c6f6d5";
            updateScoreDisplay();
            setTimeout(nextQuestion, 1200);
        } else {
            feedback.innerHTML = `<span style="color:red">❌ ${currentCorrect}</span>`;
            inputField.style.backgroundColor = "#fed7d7";
            btn.innerText = "Volgende";
            showingError = true;
            updateScoreDisplay();
        }
    }

    inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAnswer(); });

    // Start direct onmiddellijk op het scherm!
    nextQuestion();
</script>

</body>
</html>
