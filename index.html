    <style>
        /* Voorkom scrollen en zet de basis vast */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e6fffa;
            font-family: -apple-system, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            padding-top: 30px; /* Ruimte onder Dynamic Island */
            box-sizing: border-box;
            position: relative;
        }

        /* Help-knop rechtsboven */
        .help-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.4rem;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            margin: 0;
            z-index: 10;
        }

/* --- STYLING VOOR DE KEUZEKNOPPEN --- */
        .mode-selector {
            display: flex;
            background-color: #cbd5e0;
            border-radius: 8px;
            padding: 2px;
            margin-bottom: 20px;
            width: 65%; /* Was 80% - nu smaller zodat hij wegblijft van de spiekbrief-knop */
            max-width: 240px; /* Was 320px */
            z-index: 5;
        }

        .mode-btn {
            flex: 1;
            font-size: 0.8rem !important; /* Was 0.9rem - tekst iets compacter */
            padding: 6px 8px !important; /* Was 8px 10px - knop is nu minder hoog en breed */
            margin-top: 0 !important;
            background: none !important;
            border: none !important;
            border-radius: 6px !important;
            cursor: pointer !important;
            color: #4a5568 !important;
            font-weight: bold !important;
            box-shadow: none !important;
            transition: background-color 0.2s, color 0.2s;
        }
	/* Deze zorgt ervoor dat de actieve knop �cht groen wordt en blijft */
        .mode-btn.active {
            background-color: #48bb78 !important;
            color: white !important;
        }

        h1 { 
            font-size: 1.8rem; 
            color: #2d3748; 
            margin: 0; 
            text-transform: uppercase;
        }

        p { 
            font-size: 1.2rem; 
            color: #4a5568; 
            margin: 5px 0 15px 0;
        }

        #feedback { 
            font-size: 1.3rem; 
            font-weight: bold; 
            min-height: 2.5rem; 
            margin-bottom: 10px;
            width: 90%;
            text-align: center; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input {
            font-size: 1.5rem;
            padding: 12px;
            width: 80%;
            border: 2px solid #48bb78;
            border-radius: 12px;
            outline: none;
            background: white;
            text-align: center; 
            -webkit-appearance: none;
        }

        button {
            font-size: 1.3rem;
            padding: 12px 30px;
            margin-top: 20px;
            background-color: #48bb78;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #score-container {
            margin-top: 25px;
            font-size: 1rem;
            color: #718096;
            font-weight: bold;
        }

        /* --- STYLING VOOR HET OVERLAY SPIEKBRIEFJE --- */
        .overlay {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4); 
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Duwt het naar de onderkant */
            align-items: center;
        }

        .overlay-content {
            background-color: white;
            width: 94%;
            max-width: 380px;
            height: auto; 
            max-height: 43%; /* Halveert de hoogte zodat de vraag erboven past */

            padding: 15px;
            margin-bottom: 20px; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);

            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #718096;
            cursor: pointer;
        }

        .overlay h2 {
            font-size: 1.1rem;
            margin: 0 0 10px 0;
            color: #2d3748;
        }

        .tab-select {
            width: 100%;
            font-size: 1rem;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #48bb78; 
            margin-bottom: 10px;
            outline: none;
            background-color: #f7fafc;
        }

        .cheat-data {
            flex: 1;
            overflow-y: auto; 
            font-size: 0.85rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }

        th, td {
            border: 1px solid #e2e8f0;
            padding: 6px;
            text-align: left;
        }

        th {
            background-color: #edf2f7;
            color: #2d3748;
        }

            background-color: #f7fafc;
            padding: 8px;
            border-radius: 8px;
            border-left: 4px solid #48bb78;
            margin-top: 5px;
        }

</head>

        "Pretérito Imperfecto": `<table><tr><th>Persoon</th><th class="refl-column">Refl.</th><th>-ar</th><th>-er / -ir</th></tr><tr><td>yo</td><td class="refl-column">me</td><td><b>-aba</b></td><td><b>-ía</b></td></tr><tr><td>tú</td><td class="refl-column">te</td><td><b>-abas</b></td><td><b>-ías</b></td></tr><tr><td>él/ella</td><td class="refl-column">se</td><td><b>-aba</b></td><td><b>-ía</b></td></tr><tr><td>nosotros</td><td class="refl-column">nos</td><td><b>-ábamos</b></td><td><b>-íamos</b></td></tr><tr><td>vosotros</td><td class="refl-column">os</td><td><b>-abais</b></td><td><b>-íais</b></td></tr><tr><td>ellos/as</td><td class="refl-column">se</td><td><b>-aban</b></td><td><b>-ían</b></td></tr></table>`,
        "Pretérito Perfecto": `<div class="perfecto-info"><span class="refl-text"><b>Wederkerend:</b> me, te, se, nos, os, se vóór de vorm.<br><br></span><b>Hulpwerkwoord (Haber):</b><br>yo <b>he</b>, tú <b>has</b>, él <b>ha</b>, nos. <b>hemos</b>, vos. <b>habéis</b>, ellos <b>han</b><br><br><b>+ Voltooid Deelwoord:</b> -ar → <b>-ado</b> | -er/-ir → <b>-ido</b></div>`,
        "Futuro": `<div class="perfecto-info"><span class="refl-text">Reflexive vóór het hele werkwoord. <br><br></span>Plak de uitgang achter het <b>HELE werkwoord</b>:<br><br>yo <b>-é</b>, tú <b>-ás</b>, él <b>-á</b>, nos. <b>-emos</b>, vos. <b>-éis</b>, ellos <b>-án</b></div>`
    };

    // --- FUNCTIE VOOR HET WISSELEN VAN MODUS VIA DE KEUZEKNOPPEN ---
    function setPracticeMode(mode) {
        practiceMode = mode;
        document.getElementById('btnModeAll').classList.toggle('active', mode === 'all');
        document.getElementById('btnModeIrregular').classList.toggle('active', mode === 'irregular');
        nextQuestion();
    }

    // --- COMMUNICATIE LOGICA OVERLAY OPENEN/SLUITEN ---
    function openCheatSheet() {
        if (!currentTense) return; 
        document.getElementById('tenseSelect').value = currentTense;
        document.getElementById('cheatSheet').style.display = 'flex';
        changeCheatTense();
    }

    function closeCheatSheet(e) {
        document.getElementById('cheatSheet').style.display = 'none';
    }

    // --- FUNCTIE DIE GEGEVENS VERANDERT EN WEDERKERENDE INFO DYNAMISCH FILTERT ---
    function changeCheatTense() {
        const selectedTense = document.getElementById('tenseSelect').value;
        const dataBox = document.getElementById('cheatDataBox');
        
        // Zet eerst de HTML erin
        dataBox.innerHTML = cheatSheetsData[selectedTense];
        
        // Controleer welk werkwoord er actueel op het scherm staat
        const currentVerb = document.getElementById('verb').innerText.toLowerCase();
        const isReflexive = currentVerb.endsWith("se") && currentVerb !== "ser";
        
        // Als het werkwoord NIET wederkerend is, verbergen we de kolommen en teksten
        if (!isReflexive) {
            // Verberg de tabelcellen/kolommen van de reflexivos
            const reflColumns = dataBox.querySelectorAll('.refl-column');
            reflColumns.forEach(el => el.style.display = 'none');
            
            // Verberg de specifieke tekstblokjes bij Perfecto en Futuro
            const reflTexts = dataBox.querySelectorAll('.refl-text');
            reflTexts.forEach(el => el.style.display = 'none');
		}
    }

    // --- ALGORITME OM REGELMATIGE WERKWOORDEN DYNAMISCH TE VERVOEGEN ---
    function conjugateRegular(verb, tense, personIdx) {
        let isReflexive = false;
        let workingVerb = verb;

        // Is het een wederkerend regelmatig werkwoord?

        if (verb.toLowerCase().endsWith("se")) {
            isReflexive = true;
            workingVerb = verb.slice(0, -2); // strip 'se'
        }

        const type = workingVerb.slice(-2).toLowerCase(); // ar, er of ir
        const stem = workingVerb.slice(0, -2);
        let baseForm = "";
        
        if (tense === "Pretérito Perfecto") {
            const participle = type === "ar" ? "ado" : "ido";
            const aux = ["he", "has", "ha", "hemos", "habéis", "han"];
            baseForm = `${aux[personIdx]} ${stem}${participle}`;
        } else if (tense === "Futuro") {
            baseForm = workingVerb.toLowerCase() + endings[type][tense][personIdx];
        } else {
            baseForm = stem + endings[type][tense][personIdx];
        }

        return isReflexive ? `${reflexives[personIdx]} ${baseForm}` : baseForm;
	}

    // --- UPDATER VOOR DE INTERFACE SCORE-TELLER ---
    function updateScoreDisplay() {
        document.getElementById('correct-count').innerText = correctAttempts;
        document.getElementById('total-count').innerText = totalAttempts;
        const perc = totalAttempts === 0 ? 0 : Math.round((correctAttempts / totalAttempts) * 100);
        document.getElementById('percentage').innerText = perc;
    }

    // --- GENERATOR VOOR DE VOLGENDE LOGISCHE VRAAG (AANGEPAST OP PRACTICE MODE) ---
    function nextQuestion() {
        showingError = false;
        const hasRegulars = verbData.regulars && verbData.regulars.length > 0;
        
        // Als practiceMode 'irregular' is, mag useRegular NOOIT true worden!
        const useRegular = practiceMode === 'all' && Math.random() > 0.5 && hasRegulars;
        
        let verb, tense, personIdx = Math.floor(Math.random() * 6);
        const tenses = ["Presente", "Pretérito Indefinido", "Pretérito Perfecto", "Pretérito Imperfecto", "Futuro"];
        tense = tenses[Math.floor(Math.random() * tenses.length)];

        currentTense = tense;

        if (useRegular) {
            verb = verbData.regulars[Math.floor(Math.random() * verbData.regulars.length)];
            currentCorrect = conjugateRegular(verb, tense, personIdx);
		} else {
            const irregulars = Object.keys(verbData.irregulars);
            verb = irregulars[Math.floor(Math.random() * irregulars.length)];

            // Kijk nu EERST of het een string-verwijzing is (alias)
            let lookupName = (typeof verbData.irregulars[verb] === "string") ? verbData.irregulars[verb] : verb;

            // Check of de geselecteerde VRAAGVORM op 'se' eindigt
            let isReflexive = verb.toLowerCase().endsWith("se") && verb.toLowerCase() !== "ser";
            
            let answer = verbData.irregulars[lookupName][tense][personIdx];
            currentCorrect = isReflexive ? `${reflexives[personIdx]} ${answer}` : answer;
        }
        
        document.getElementById('verb').innerText = verb;
        document.getElementById('info').innerText = `${tense} (${pronouns[personIdx]})`;
        
        inputField.value = "";
        inputField.style.backgroundColor = "white";
        document.getElementById('feedback').innerText = "";
        document.getElementById('mainButton').innerText = "Comprobar";
        
        lockScroll();
        setTimeout(() => { inputField.focus(); }, 100);
    }

    // --- CONTROLE LOGICA VAN HET ANTWOORD ---
    function checkAnswer() {
        const userAns = inputField.value.trim().toLowerCase().replace(/\s+/g, ' '); 
        const feedback = document.getElementById('feedback');
        const btn = document.getElementById('mainButton');

        if (showingError) {
            nextQuestion();
            return;
        }

        totalAttempts++;

        if (userAns === currentCorrect.toLowerCase()) {
            correctAttempts++;
            feedback.innerHTML = "<span style='color:green'>✅ ¡Muy bien!</span>";
            inputField.style.backgroundColor = "#c6f6d5";
            updateScoreDisplay();
            setTimeout(nextQuestion, 1200);
        } else {
            feedback.innerHTML = `<span style="color:red">❌ ${currentCorrect}</span>`;
            inputField.style.backgroundColor = "#fed7d7";
            btn.innerText = "Siguiente";
            showingError = true;
            updateScoreDisplay();
        }
    }

    inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAnswer(); });

    // --- INITIALISATIE: START DIRECT OP HET SCHERM ---
    nextQuestion();
</script>
