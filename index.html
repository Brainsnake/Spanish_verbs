<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spaans Compact</title>
    <style>
        body {
            background-color: #e6fffa;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            min-height: 100vh;
            margin: 0;
            padding: 5px; /* Minimale padding */
            text-align: center;
            overflow: hidden; /* Voorkomt onnodig scrollen */
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        /* Werkwoord en info op één regel of heel dicht bij elkaar */
        h1 { 
            font-size: 1.6rem; 
            color: #2d3748; 
            margin: 5px 0 0 0; 
            display: inline-block;
        }

        p { 
            font-size: 1.1rem; 
            color: #4a5568; 
            margin: 0 0 5px 0;
            font-weight: bold;
        }

        /* Feedback ruimte verkleind */
        #feedback { 
            font-size: 1.2rem; 
            margin: 5px 0; 
            min-height: 2.5rem; 
            line-height: 1.2;
        }

        input {
            font-size: 1.4rem;
            padding: 8px;
            width: 80%;
            border: 2px solid #48bb78;
            border-radius: 8px;
            outline: none;
        }

        button {
            font-size: 1.2rem;
            padding: 8px 20px;
            margin-top: 10px;
            background-color: #48bb78;
            color: white;
            border: none;
            border-radius: 8px;
        }

        /* Extra kleine letters voor de hulptekst bij fouten */
        .small-tip { font-size: 0.8rem; display: block; margin-top: 2px; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="verb">Laden...</h1>
    <p id="info"></p>
    
    <div id="feedback"></div>

    <input type="text" id="answer" placeholder="Antwoord..." autocomplete="off" autocapitalize="none" spellcheck="false">
    <br>
    <button id="mainButton" onclick="checkAnswer()">Controleer</button>
</div>

<script>
    // Gebruik je eigen Gist link hier:
    const jsonUrl = "https://gist.githubusercontent.com/Brainsnake/f9b6841f2705d38bb1164ce6c054cb81/raw/9b246b0cd6b250b5eedcc6ec006876fc490c56dd/werkwoorden.json"; 
    
    let verbData = {};
    const pronouns = ["yo", "tú", "él/ella/usted", "nosotros/as", "vosotros/as", "ellos/ellas/ustedes"];
    let currentCorrect = "";
    let showingError = false;

    async function fetchData() {
        try {
            const response = await fetch(jsonUrl);
            verbData = await response.json();
            nextQuestion();
        } catch (error) {
            document.getElementById('verb').innerText = "Fout!";
        }
    }

    function nextQuestion() {
        showingError = false;
        const verbs = Object.keys(verbData);
        const verb = verbs[Math.floor(Math.random() * verbs.length)];
        const tenses = Object.keys(verbData[verb]);
        const tense = tenses[Math.floor(Math.random() * tenses.length)];
        const personIdx = Math.floor(Math.random() * 6);

        currentCorrect = verbData[verb][tense][personIdx];

        document.getElementById('verb').innerText = verb.toUpperCase();
        // Tijd en persoon korter achter elkaar
        document.getElementById('info').innerText = `${tense} (${pronouns[personIdx]})`;
        
        const inputField = document.getElementById('answer');
        inputField.value = "";
        inputField.style.backgroundColor = "white";
        document.getElementById('feedback').innerText = "";
        document.getElementById('mainButton').innerText = "Controleer";
        inputField.focus();
    }

    function checkAnswer() {
        const inputField = document.getElementById('answer');
        const userAns = inputField.value.trim().toLowerCase();
        const feedback = document.getElementById('feedback');
        const btn = document.getElementById('mainButton');

        if (showingError) {
            nextQuestion();
            return;
        }

        if (userAns === currentCorrect.toLowerCase()) {
            feedback.innerHTML = "<span style='color:green'>✅ ¡Bien!</span>";
            inputField.style.backgroundColor = "#c6f6d5";
            setTimeout(nextQuestion, 1000);
        } else {
            feedback.innerHTML = `<span style="color:red; font-size:1rem;">❌ Fout: ${currentCorrect}</span><span class="small-tip">(Enter voor volgende)</span>`;
            inputField.style.backgroundColor = "#fed7d7";
            btn.innerText = "Volgende";
            showingError = true;
        }
    }

    document.getElementById('answer').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') checkAnswer();
    });

    fetchData();
</script>

</body>
</html>
