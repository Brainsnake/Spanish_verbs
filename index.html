<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spaans Compact Pro</title>
    <style>
        body {
            background-color: #e6fffa;
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            /* Extra marge bovenaan om onder de camera weg te blijven */
            padding-top: 45px; 
            text-align: center;
            overflow: hidden;
        }

        .container {
            width: 95%;
            max-width: 400px;
        }

        /* Alles op één regel: Werkwoord + Info */
        .header-row {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 5px;
        }

        #verb { 
            font-size: 1.4rem; 
            color: #2d3748; 
            margin: 0;
            text-transform: uppercase;
            font-weight: bold;
        }

        #info { 
            font-size: 1rem; 
            color: #4a5568; 
            margin: 0;
        }

        /* Feedback zeer compact */
        #feedback { 
            font-size: 1.1rem; 
            margin-bottom: 8px; 
            min-height: 1.4rem;
            font-weight: bold;
        }

        input {
            font-size: 1.3rem;
            padding: 8px;
            width: 85%;
            border: 2px solid #48bb78;
            border-radius: 8px;
            outline: none;
            background: white;
        }

        button {
            font-size: 1.1rem;
            padding: 6px 20px;
            margin-top: 8px;
            background-color: #48bb78;
            color: white;
            border: none;
            border-radius: 8px;
        }

        /* Kleine correctie voor de feedback tekst */
        .correct-answer { font-size: 1.2rem; color: #e53e3e; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <span id="verb">Laden...</span>
        <span id="info"></span>
    </div>
    
    <div id="feedback"></div>

    <input type="text" id="answer" placeholder="Antwoord..." autocomplete="off" autocapitalize="none" spellcheck="false">
    <br>
    <button id="mainButton" onclick="checkAnswer()">Controleer</button>
</div>

<script>
    // Gebruik je eigen Gist link hier:
    const jsonUrl = "https://gist.githubusercontent.com/Brainsnake/f9b6841f2705d38bb1164ce6c054cb81/raw/9b246b0cd6b250b5eedcc6ec006876fc490c56dd/werkwoorden.json"; 
    
    let verbData = {};
    const pronouns = ["yo", "tú", "él/ella/usted", "nosotros/as", "vosotros/as", "ellos/ellas/ustedes"];
    let currentCorrect = "";
    let showingError = false;

    async function fetchData() {
        try {
            const response = await fetch(jsonUrl);
            verbData = await response.json();
            nextQuestion();
        } catch (error) {
            document.getElementById('verb').innerText = "Fout bij laden!";
        }
    }

    function nextQuestion() {
        showingError = false;
        const verbs = Object.keys(verbData);
        const verb = verbs[Math.floor(Math.random() * verbs.length)];
        const tenses = Object.keys(verbData[verb]);
        const tense = tenses[Math.floor(Math.random() * tenses.length)];
        const personIdx = Math.floor(Math.random() * 6);

        currentCorrect = verbData[verb][tense][personIdx];

        document.getElementById('verb').innerText = verb;
        document.getElementById('info').innerText = `| ${tense} (${pronouns[personIdx]})`;
        
        const inputField = document.getElementById('answer');
        inputField.value = "";
        inputField.style.backgroundColor = "white";
        document.getElementById('feedback').innerText = "";
        document.getElementById('mainButton').innerText = "Controleer";
        inputField.focus();
    }

    function checkAnswer() {
        const inputField = document.getElementById('answer');
        const userAns = inputField.value.trim().toLowerCase();
        const feedback = document.getElementById('feedback');
        const btn = document.getElementById('mainButton');

        if (showingError) {
            nextQuestion();
            return;
        }

        if (userAns === currentCorrect.toLowerCase()) {
            feedback.innerHTML = "<span style='color:green'>✅ ¡Bien!</span>";
            inputField.style.backgroundColor = "#c6f6d5";
            setTimeout(nextQuestion, 1000);
        } else {
            feedback.innerHTML = `<span class="correct-answer">❌ ${currentCorrect}</span>`;
            inputField.style.backgroundColor = "#fed7d7";
            btn.innerText = "Volgende";
            showingError = true;
        }
    }

    document.getElementById('answer').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') checkAnswer();
    });

    fetchData();
</script>

</body>
</html>
