<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaans Leren</title>
    <style>
        body {
            background-color: #e6fffa; /* De zeer lichtgroene kleur */
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            width: 90%;
            max-width: 600px;
        }
        h1 { font-size: 3rem; color: #2d3748; margin-bottom: 10px; }
        p { font-size: 1.8rem; color: #4a5568; }
        input {
            font-size: 2rem;
            padding: 15px;
            width: 80%;
            border: 2px solid #48bb78;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }
        button {
            font-size: 1.8rem;
            padding: 15px 30px;
            margin-top: 20px;
            background-color: #48bb78;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        #feedback {
            font-size: 2rem;
            margin-top: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="verb">Laden...</h1>
    <p id="info"></p>
    <input type="text" id="answer" placeholder="Typ antwoord..." autocomplete="off">
    <br>
    <button onclick="checkAnswer()">Controleer</button>
    <div id="feedback"></div>
</div>

<script>
    // 1. Configuratie
    const jsonUrl = "https://gist.githubusercontent.com/Brainsnake/f9b6841f2705d38bb1164ce6c054cb81/raw/9b246b0cd6b250b5eedcc6ec006876fc490c56dd/werkwoorden.json"; 
    let verbData = {};
    const pronouns = ["yo", "tú", "él/ella/usted", "nosotros/as", "vosotros/as", "ellos/ellas/ustedes"];
    let currentCorrect = "";
    let showingError = false; // Nieuwe 'schakelaar' om de status bij te houden

    // 2. Data ophalen
    async function fetchData() {
        try {
            const response = await fetch(jsonUrl);
            if (!response.ok) throw new Error("Link werkt niet");
            verbData = await response.json();
            nextQuestion();
        } catch (error) {
            document.getElementById('verb').innerText = "Laadfout!";
            console.error(error);
        }
    }

    // 3. Volgende vraag genereren
    function nextQuestion() {
        showingError = false; // Reset de fout-status
        const verbs = Object.keys(verbData);
        const verb = verbs[Math.floor(Math.random() * verbs.length)];
        const tenses = Object.keys(verbData[verb]);
        const tense = tenses[Math.floor(Math.random() * tenses.length)];
        const personIdx = Math.floor(Math.random() * 6);

        currentCorrect = verbData[verb][tense][personIdx];

        document.getElementById('verb').innerText = verb.toUpperCase();
        document.getElementById('info').innerText = `${tense} \n (${pronouns[personIdx]})`;
        document.getElementById('answer').value = "";
        document.getElementById('feedback').innerText = "";
        document.getElementById('answer').style.backgroundColor = "white";
        document.getElementById('answer').focus();
    }

    // 4. Controleer antwoord (De Optie 2 logica)
    function checkAnswer() {
        const inputField = document.getElementById('answer');
        const userAns = inputField.value.trim().toLowerCase();
        const feedback = document.getElementById('feedback');

        // ALS er al een fout getoond wordt -> ga naar de volgende vraag
        if (showingError) {
            nextQuestion();
            return;
        }

        // Controleer of het antwoord goed is
        if (userAns === currentCorrect.toLowerCase()) {
            feedback.innerText = "✅ ¡Muy bien!";
            feedback.style.color = "green";
            inputField.style.backgroundColor = "#c6f6d5"; // Lichtgroen bij succes
            setTimeout(nextQuestion, 1200);
        } else {
            // Fout antwoord
            feedback.innerText = `❌ Fout. Het was: ${currentCorrect}`;
            feedback.style.color = "red";
            inputField.style.backgroundColor = "#fed7d7"; // Lichtrood bij fout
            showingError = true; // Zet de schakelaar op 'fout getoond'
            
            // Instructie toevoegen voor de gebruiker
            const tip = document.createElement("div");
            tip.innerText = "(Druk Enter voor de volgende)";
            tip.style.fontSize = "1rem";
            feedback.appendChild(tip);
        }
    }

    // 5. Event Listeners
    document.getElementById('answer').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    });

    fetchData();
</script>
</body>
</html>
